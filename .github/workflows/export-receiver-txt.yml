name: Export receiver txt

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  export:
    if: github.event.issue.title == 'Export Receiver TXT'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Make txt copy
        run: cp receiver.lua receiver_obfuscated.txt

      - name: Upload txt
        uses: actions/upload-artifact@v4
        with:
          name: receiver-obfuscated-txt
          path: receiver_obfuscated.txt
          compression-level: 0
